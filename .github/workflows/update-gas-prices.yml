# Gas price updater v3 — all states from live EIA series (scripts/build-gas-prices.js)
name: Update Gas Prices

on:
  schedule:
    - cron: '0 10 * * 1'  # Every Monday at 10am UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  update-gas-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch EIA gas prices
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          curl -sf --globoff "https://api.eia.gov/v2/petroleum/pri/gnd/data/?api_key=${EIA_API_KEY}&frequency=weekly&data[0]=value&facets[series][]=EMM_EPMR_PTE_NUS_DPG&facets[series][]=EMM_EPMR_PTE_R10_DPG&facets[series][]=EMM_EPMR_PTE_R20_DPG&facets[series][]=EMM_EPMR_PTE_R30_DPG&facets[series][]=EMM_EPMR_PTE_R40_DPG&facets[series][]=EMM_EPMR_PTE_R50_DPG&facets[series][]=EMM_EPMR_PTE_R5XCA_DPG&facets[series][]=EMM_EPMR_PTE_SCA_DPG&facets[series][]=EMM_EPMR_PTE_SCO_DPG&facets[series][]=EMM_EPMR_PTE_SFL_DPG&facets[series][]=EMM_EPMR_PTE_SMA_DPG&facets[series][]=EMM_EPMR_PTE_SMN_DPG&facets[series][]=EMM_EPMR_PTE_SNY_DPG&facets[series][]=EMM_EPMR_PTE_SOH_DPG&facets[series][]=EMM_EPMR_PTE_STX_DPG&facets[series][]=EMM_EPMR_PTE_SWA_DPG&sort[0][column]=period&sort[0][direction]=desc&length=100" > eia_raw.json
          echo "EIA response size: $(wc -c < eia_raw.json) bytes"

      - name: Build gas-prices.json
        run: node scripts/build-gas-prices.js eia_raw.json

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gas-prices.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update gas prices $(date +%Y-%m-%d)"
          git push
